<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartLegis · Regulamentação</title>
  <style>
/* ==========================================================================
   SmartLegis · Módulo de Regulamentação · Mock styles v0.4
   Tokens extraídos pixel-a-pixel de qual.smartlegis.gov.pt (2026-04-29)
   via Claude in Chrome. Paleta: laranja #F2784B + azul/roxo #3A529C +
   turquesa #36D7B7 (wizard). Pill border-radius: 19.5px.
   ========================================================================== */

:root {
  /* Cores primárias */
  --sl-primary:        #F2784B;   /* Laranja: Criar, Editar, Avançar, Confirmar, Hoje */
  --sl-primary-hover:  #E5663A;
  --sl-secondary:      #3A529C;   /* Azul/roxo: header tabela, tab ativa, headers de secção */
  --sl-secondary-dark: #2E4180;
  --sl-success:        #36D7B7;   /* Turquesa: passo ativo do wizard, badge de mensagens */
  --sl-upload-blue:    #5B5F9E;   /* Botões "Envie o seu ficheiro" */

  /* Cinzas e neutros */
  --sl-text:           #4C4C4C;
  --sl-text-strong:    #000000;
  --sl-text-muted:     #95A2A6;
  --sl-text-soft:      #808080;
  --sl-link:           #3A529C;

  /* Backgrounds */
  --sl-bg:             #F9F9F9;
  --sl-bg-sheet:       #F7F7F7;
  --sl-bg-card:        #FFFFFF;
  --sl-bg-row-alt:     #F7F7F7;
  --sl-bg-thead:       #EEEEEE;
  --sl-bg-today:       #FBF8E5;

  /* Estados informativos (para o mock) */
  --sl-info:           #5B5F9E;
  --sl-info-bg:        #E8E9F4;
  --sl-warn:           #C97E00;
  --sl-warn-bg:        #FBF1DC;
  --sl-danger:         #C8102E;
  --sl-danger-bg:      #FCE8EB;
  --sl-success-bg:     #D5F5EC;

  /* Borders */
  --sl-border:         #DEE2E6;
  --sl-border-light:   #E9ECEF;
  --sl-border-modal:   rgba(0, 0, 0, 0.2);

  /* Tipografia */
  --sl-font: Noto, "Lucida Grande", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --sl-fs-xs:      10px;
  --sl-fs-sm:      12px;
  --sl-fs-base:    13px;
  --sl-fs-md:      14px;
  --sl-fs-lg:      15.6px;
  --sl-fs-xl:      19.5px;
  --sl-fs-xxl:     26px;
  --sl-fs-display: 40px;
  --sl-line:       19.5px;

  /* Radii */
  --sl-radius-pill: 19.5px;
  --sl-radius-sm:   3px;
  --sl-radius-md:   3.6px;

  /* Espaços */
  --sl-navbar-h:        55px;
  --sl-control-panel-h: 42px;
  --sl-row-h:           27px;
  --sl-step-circle:     39px;
  --sl-sidebar-w:       234px;

  /* Sombras */
  --sl-shadow-dropdown: 0 6px 12px -4px rgba(0, 0, 0, 0.25);
  --sl-shadow-modal:    0 6px 12px -4px rgba(0, 0, 0, 0.25);
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0;
  font-family: var(--sl-font);
  font-size: var(--sl-fs-base);
  line-height: var(--sl-line);
  color: var(--sl-text);
  background: var(--sl-bg);
}

a { color: var(--sl-link); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font-family: inherit; cursor: pointer; }
hr { border: 0; border-top: 1px solid var(--sl-border); margin: 8px 0; }

/* ============ Topbar (navbar) ============ */
.sl-navbar {
  height: var(--sl-navbar-h);
  background: var(--sl-bg-card);
  display: flex;
  align-items: center;
  padding: 0;
  position: sticky; top: 0; z-index: 50;
  border-bottom: 1px solid var(--sl-border);
}
.sl-navbar__logo {
  display: flex; align-items: center; gap: 10px;
  padding: 0 16px;
  cursor: pointer;
  height: 100%;
  border-right: 1px solid var(--sl-border);
}
.sl-navbar__logo:hover { background: var(--sl-bg-sheet); }
.sl-navbar__logo-mark {
  width: 24px; height: 24px;
  background: linear-gradient(135deg,
    var(--sl-primary) 0%, var(--sl-primary) 50%,
    var(--sl-secondary) 50%, var(--sl-secondary) 100%);
  clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
  flex-shrink: 0;
}
.sl-navbar__brand {
  color: var(--sl-text-soft);
  font-size: var(--sl-fs-sm);
  font-weight: 500;
  letter-spacing: 0.5px;
}

.sl-navbar__breadcrumb {
  flex: 1;
  padding: 0 16px;
  color: var(--sl-text);
  font-size: var(--sl-fs-xs);
}
.sl-navbar__breadcrumb a { color: var(--sl-link); text-decoration: underline; }
.sl-navbar__breadcrumb-sep { margin: 0 6px; color: var(--sl-text-muted); }

.sl-navbar__right {
  display: flex; align-items: center; gap: 18px;
  padding-right: 16px;
}
.sl-navbar__icon-btn {
  position: relative;
  background: none; border: 0;
  font-size: 16px;
  color: var(--sl-text-muted);
  width: 30px; height: 30px;
  display: inline-flex; align-items: center; justify-content: center;
}
.sl-navbar__icon-btn:hover { color: var(--sl-text); }
.sl-navbar__badge {
  position: absolute; top: -2px; right: -4px;
  background: var(--sl-success);
  color: #fff;
  border-radius: 10px; padding: 1px 5px;
  font-size: 10px; font-weight: 600;
  min-width: 16px; text-align: center;
}
.sl-navbar__user {
  display: flex; align-items: center; gap: 6px;
  font-size: var(--sl-fs-base);
  color: var(--sl-text);
  cursor: pointer;
}
.sl-navbar__user-avatar {
  width: 26px; height: 26px;
  border-radius: 50%;
  background: var(--sl-primary);
  color: #fff;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600;
}

/* ============ Sidebar (apps dropdown popup) ============ */
.sl-sidebar {
  position: absolute;
  top: var(--sl-navbar-h);
  left: 0;
  width: var(--sl-sidebar-w);
  background: var(--sl-bg-sheet);
  border: 1px solid var(--sl-border);
  border-radius: var(--sl-radius-sm);
  box-shadow: var(--sl-shadow-dropdown);
  padding: 6px 0;
  max-height: calc(100vh - 60px);
  overflow-y: auto;
  z-index: 40;
  display: none;
}
.sl-sidebar.is-open { display: block; }
.sl-sidebar__item {
  display: flex; align-items: center; gap: 12px;
  padding: 6px 20px;
  height: 57px;
  color: var(--sl-text-muted);
  font-size: var(--sl-fs-sm);
  font-weight: 400;
  text-decoration: none;
  cursor: pointer;
}
.sl-sidebar__item:hover { background: rgba(0,0,0,0.04); text-decoration: none; }
.sl-sidebar__item--active {
  color: var(--sl-text-strong);
  font-weight: 500;
}
.sl-sidebar__item--active .sl-sidebar__icon {
  background: #2A2A2A;
  color: #fff;
}
.sl-sidebar__icon {
  width: 36px; height: 36px;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 22px;
  border-radius: 4px;
  color: var(--sl-text-muted);
  flex-shrink: 0;
}

/* ============ Layout body ============ */
.sl-main {
  min-height: calc(100vh - var(--sl-navbar-h));
}

/* ============ Control Panel ============ */
.sl-cp {
  height: var(--sl-control-panel-h);
  background: var(--sl-bg-sheet);
  padding: 0 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid var(--sl-border);
}
.sl-cp__breadcrumb {
  color: var(--sl-text);
  font-size: var(--sl-fs-xs);
}
.sl-cp__breadcrumb a { color: var(--sl-link); text-decoration: underline; }
.sl-cp__breadcrumb-sep { margin: 0 6px; color: var(--sl-text-muted); }
.sl-cp__buttons { display: flex; align-items: center; gap: 8px; }
.sl-cp__right {
  margin-left: auto;
  display: flex; align-items: center; gap: 10px;
}
.sl-pager {
  display: flex; align-items: center; gap: 6px;
  font-size: var(--sl-fs-base);
}
.sl-pager__nav {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: var(--sl-bg-card);
  border: 1px solid var(--sl-border);
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--sl-text);
  cursor: pointer;
}
.sl-pager__nav:hover { background: var(--sl-bg-sheet); }

/* ============ Botões ============ */
.sl-btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 6px;
  font-family: var(--sl-font);
  font-size: var(--sl-fs-base);
  font-weight: 400;
  padding: 6.5px 19.5px;
  border-radius: var(--sl-radius-pill);
  border: 1px solid transparent;
  background: var(--sl-bg-card);
  color: var(--sl-text-strong);
  text-decoration: none;
  white-space: nowrap;
  transition: background 0.12s ease;
  line-height: 1.2;
}
.sl-btn:hover { text-decoration: none; }
.sl-btn--primary {
  background: var(--sl-primary);
  color: #fff;
}
.sl-btn--primary:hover { background: var(--sl-primary-hover); color: #fff; }
.sl-btn--secondary {
  background: var(--sl-bg-card);
  color: #212529;
  border-color: var(--sl-border);
}
.sl-btn--secondary:hover { background: #F1F3F5; }
.sl-btn--upload {
  background: var(--sl-upload-blue);
  color: #fff;
}
.sl-btn--link {
  background: transparent;
  color: var(--sl-link);
  text-decoration: underline;
  border: 0;
  padding: 6.5px 4px;
}
.sl-btn--icon {
  padding: 0;
  width: 30px; height: 30px;
  border-radius: 50%;
  border: 1px solid var(--sl-border);
}
.sl-btn--small {
  border-radius: var(--sl-radius-sm);
  padding: 4.5px 9px;
}
.sl-btn--danger {
  background: var(--sl-danger);
  color: #fff;
}
.sl-btn:disabled, .sl-btn[disabled] { opacity: 0.5; cursor: not-allowed; }

/* ============ Form view ============ */
.sl-form-bg {
  background: var(--sl-bg-sheet);
  padding: 24px 16px;
  min-height: calc(100vh - var(--sl-navbar-h) - var(--sl-control-panel-h));
}
.sl-form-sheet {
  background: var(--sl-bg-card);
  max-width: 1140px;
  margin: 0 auto;
  padding: 24px 32px;
  border-radius: var(--sl-radius-sm);
  border: 1px solid var(--sl-border);
}
.sl-form__title {
  font-size: var(--sl-fs-xxl);
  font-weight: 700;
  color: var(--sl-text);
  text-align: center;
  margin: 0 0 6px;
}
.sl-form__subtitle {
  text-align: center;
  font-size: var(--sl-fs-base);
  color: var(--sl-text-muted);
  margin: 0 0 16px;
}

.sl-form__row {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px 24px;
  margin-bottom: 12px;
}
.sl-form__row--4 { grid-template-columns: repeat(4, 1fr); }
.sl-form__row--3 { grid-template-columns: repeat(3, 1fr); }
.sl-form__field { display: flex; flex-direction: column; }
.sl-form__field--full { grid-column: 1 / -1; }
.sl-form__label {
  font-size: var(--sl-fs-base);
  font-weight: 700;
  color: var(--sl-text);
  margin-bottom: 4px;
}
.sl-form__label--required::after {
  content: " *";
  color: var(--sl-danger);
}
.sl-form__value {
  font-size: var(--sl-fs-base);
  color: var(--sl-text);
  border-bottom: 1px solid var(--sl-border);
  padding: 4px 0;
  min-height: 24px;
}
.sl-form__input {
  border: 0;
  border-bottom: 1px solid var(--sl-border);
  background: transparent;
  outline: 0;
  font-family: inherit;
  font-size: var(--sl-fs-base);
  padding: 4px 0;
  width: 100%;
}
.sl-form__input:focus { border-bottom-color: var(--sl-secondary); }
.sl-form__textarea {
  border: 1px solid var(--sl-border);
  border-radius: var(--sl-radius-sm);
  padding: 6px 8px;
  font-family: inherit;
  font-size: var(--sl-fs-base);
  background: var(--sl-bg-card);
  resize: vertical;
  min-height: 60px;
  width: 100%;
}
.sl-form__select {
  border: 1px solid var(--sl-border);
  border-radius: var(--sl-radius-sm);
  padding: 4px 8px;
  font-family: inherit;
  font-size: var(--sl-fs-base);
  background: var(--sl-bg-card);
  width: 100%;
}

/* ============ Notebook (tabs) — estilo SmartLegis real ============ */
.sl-notebook { margin: 16px 0 0; }
.sl-notebook__tabs {
  display: flex;
  gap: 2px;
  border-bottom: 1px solid var(--sl-secondary);
  list-style: none;
  padding: 0;
  margin: 0;
}
.sl-notebook__tab {
  padding: 6px 14px;
  font-size: var(--sl-fs-base);
  font-weight: 400;
  color: var(--sl-secondary);
  background: transparent;
  border: 0;
  border-radius: var(--sl-radius-sm) var(--sl-radius-sm) 0 0;
  cursor: pointer;
}
.sl-notebook__tab:hover { background: rgba(58,82,156,0.08); }
.sl-notebook__tab--active {
  background: var(--sl-secondary);
  color: #fff;
  font-weight: 500;
}
.sl-notebook__tab--active:hover { background: var(--sl-secondary-dark); }
.sl-notebook__page { padding: 16px 0; }

/* ============ Secções colapsáveis (em vez de chatter) ============ */
.sl-section { margin-top: 16px; }
.sl-section__header {
  background: var(--sl-secondary);
  color: #fff;
  font-size: var(--sl-fs-base);
  font-weight: 600;
  letter-spacing: 0.6px;
  padding: 10px 16px;
  border-radius: var(--sl-radius-sm);
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  text-transform: uppercase;
  user-select: none;
}
.sl-section__header:hover { background: var(--sl-secondary-dark); }
.sl-section__chevron { font-size: 14px; transition: transform 0.2s; }
.sl-section--open .sl-section__header {
  border-radius: var(--sl-radius-sm) var(--sl-radius-sm) 0 0;
}
.sl-section--open .sl-section__chevron { transform: rotate(180deg); }
.sl-section__body {
  background: var(--sl-bg-card);
  padding: 14px 16px;
  border: 1px solid var(--sl-border);
  border-top: 0;
  border-radius: 0 0 var(--sl-radius-sm) var(--sl-radius-sm);
  display: none;
}
.sl-section--open .sl-section__body { display: block; }

/* ============ Tabela (list view) ============ */
.sl-table-wrap {
  background: var(--sl-bg-card);
  border: 1px solid var(--sl-border);
  border-radius: var(--sl-radius-sm);
  overflow: auto;
}
.sl-table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--sl-fs-base);
}
.sl-table thead th {
  background: var(--sl-secondary);
  color: #fff;
  font-size: var(--sl-fs-md);
  font-weight: 700;
  text-align: left;
  padding: 5px 8px;
  white-space: nowrap;
  position: sticky; top: 0;
}
.sl-table tbody td {
  padding: 5px 8px;
  font-size: var(--sl-fs-base);
  color: var(--sl-text-strong);
  vertical-align: middle;
  border-bottom: 1px solid var(--sl-border-light);
}
.sl-table tbody tr { background: var(--sl-bg-card); }
.sl-table tbody tr:nth-child(even) { background: var(--sl-bg-row-alt); }
.sl-table tbody tr:hover { background: #EEF1FB; cursor: pointer; }

/* Tabela inline em form (.sl-table--inline para tabelas dentro de notebook pages) */
.sl-table--inline thead th {
  background: var(--sl-bg-thead);
  color: var(--sl-text);
  font-size: var(--sl-fs-sm);
  text-transform: uppercase;
  font-weight: 600;
}

/* ============ Search/Filter pills ============ */
.sl-searchbox {
  display: flex; align-items: center; gap: 8px;
  background: var(--sl-bg-card);
  border: 1px solid var(--sl-border);
  border-radius: var(--sl-radius-pill);
  padding: 4px 14px;
  font-size: var(--sl-fs-base);
}
.sl-searchbox input {
  flex: 1;
  border: 0; outline: 0; background: transparent;
  font-size: var(--sl-fs-base);
}
.sl-filter-pill {
  background: var(--sl-bg-card);
  border-radius: var(--sl-radius-pill);
  padding: 4px 14px;
  display: inline-flex; align-items: center; gap: 8px;
  border: 1px solid var(--sl-border);
  font-size: var(--sl-fs-base);
  cursor: pointer;
  color: var(--sl-text);
}
.sl-filter-pill:hover { background: var(--sl-bg-sheet); }
.sl-filter-pill__caret { font-size: 10px; color: var(--sl-text-muted); }

/* ============ Dropdown menu (Ação ▼) ============ */
.sl-dropdown {
  position: absolute;
  background: var(--sl-bg-sheet);
  border: 1px solid var(--sl-border);
  border-radius: var(--sl-radius-sm);
  box-shadow: var(--sl-shadow-dropdown);
  min-width: 220px;
  padding: 6px 0;
  z-index: 60;
  display: none;
}
.sl-dropdown.is-open { display: block; }
.sl-dropdown__item {
  display: block;
  padding: 4px 20px;
  color: var(--sl-text);
  font-size: var(--sl-fs-sm);
  line-height: 18px;
  text-decoration: none;
  cursor: pointer;
}
.sl-dropdown__item:hover {
  background: rgba(58,82,156,0.08);
  color: var(--sl-secondary);
  text-decoration: none;
}

/* ============ Modal ============ */
.sl-modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 999;
  display: none;
}
.sl-modal-backdrop.is-open { display: block; }
.sl-modal {
  position: fixed;
  top: 50px;
  left: 50%;
  transform: translateX(-50%);
  max-width: 650px;
  width: calc(100% - 32px);
  z-index: 1000;
}
.sl-modal__content {
  background: var(--sl-bg-card);
  border: 1px solid var(--sl-border-modal);
  border-radius: var(--sl-radius-md);
  box-shadow: var(--sl-shadow-modal);
}
.sl-modal__header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid var(--sl-border-light);
}
.sl-modal__title {
  font-size: var(--sl-fs-lg);
  font-weight: 700;
  color: var(--sl-text);
}
.sl-modal__title-suffix {
  color: var(--sl-text-muted);
  font-weight: 400;
  margin-left: 6px;
}
.sl-modal__close {
  border: 0; background: transparent;
  font-size: 18px;
  color: var(--sl-text-muted);
  cursor: pointer;
}
.sl-modal__body {
  padding: 16px;
  color: var(--sl-text);
  font-size: var(--sl-fs-base);
}
.sl-modal__footer {
  padding: 0 16px 16px;
  display: flex; gap: 10px;
  justify-content: flex-end;
}

/* ============ Wizard (3 passos) ============ */
.sl-wizard {
  background: var(--sl-bg-card);
  max-width: 1140px;
  margin: 16px auto;
  padding: 24px 36px 8px;
  border-radius: var(--sl-radius-sm);
  border: 1px solid var(--sl-border);
}
.sl-wizard__stepper {
  display: flex; align-items: center; justify-content: center;
  gap: 0;
  padding: 8px 0 24px;
}
.sl-wizard__step {
  display: flex; flex-direction: column; align-items: center;
  flex: 0 0 auto;
}
.sl-wizard__circle {
  width: var(--sl-step-circle);
  height: var(--sl-step-circle);
  border-radius: var(--sl-radius-pill);
  background: var(--sl-bg-card);
  color: var(--sl-text-muted);
  font-size: var(--sl-fs-base);
  font-weight: 500;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--sl-border);
}
.sl-wizard__label {
  margin-top: 8px;
  font-size: 11px;
  color: var(--sl-text-muted);
  text-transform: uppercase;
  text-align: center;
  letter-spacing: 0.4px;
  max-width: 220px;
  line-height: 1.3;
}
.sl-wizard__connector {
  height: 1px;
  background: var(--sl-border);
  width: 80px;
  margin: -28px 12px 0;
}
.sl-wizard__step--active .sl-wizard__circle,
.sl-wizard__step--done .sl-wizard__circle {
  background: var(--sl-success);
  color: #fff;
  border-color: var(--sl-success);
}
.sl-wizard__step--active .sl-wizard__label { color: var(--sl-text); font-weight: 500; }
.sl-wizard__intro {
  text-align: center;
  font-size: var(--sl-fs-base);
  color: var(--sl-text);
  margin: 0 0 18px;
}
.sl-wizard__footer {
  display: flex; align-items: center;
  margin-top: 24px; padding-top: 16px;
  border-top: 1px solid var(--sl-border-light);
}
.sl-wizard__footer-spacer { flex: 1; }
.sl-wizard__footer .sl-btn--link { margin-right: 12px; }

/* Radio inline (Não/Sim, Preencher/Carregar) */
.sl-radio-group { display: inline-flex; gap: 18px; align-items: center; }
.sl-radio { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: var(--sl-fs-base); }
.sl-radio input[type="radio"] {
  appearance: none;
  width: 14px; height: 14px;
  border-radius: 50%;
  border: 1px solid var(--sl-secondary);
  position: relative;
  cursor: pointer;
}
.sl-radio input[type="radio"]:checked {
  background: var(--sl-secondary);
  box-shadow: inset 0 0 0 2px #fff;
}

/* ============ Cards (dashboard) ============ */
.sl-card {
  background: var(--sl-bg-card);
  border: 1px solid var(--sl-border);
  border-radius: 14px;
  padding: 24px 16px;
  text-align: center;
  display: flex; flex-direction: column; align-items: center;
  gap: 8px;
}
.sl-card__number {
  font-size: var(--sl-fs-display);
  font-weight: 400;
  color: var(--sl-text);
  line-height: 1;
}
.sl-card__title {
  font-size: var(--sl-fs-xl);
  font-weight: 700;
  color: var(--sl-text-strong);
  text-transform: uppercase;
  margin: 4px 0;
}
.sl-card hr { width: 80%; }

.sl-card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  padding: 24px;
}

/* ============ Banners ============ */
.sl-banner {
  padding: 12px 16px;
  border-radius: var(--sl-radius-sm);
  margin-bottom: 16px;
  display: flex; gap: 12px; align-items: flex-start;
  font-size: var(--sl-fs-base);
  border-left: 4px solid var(--sl-info);
  background: var(--sl-info-bg);
  color: var(--sl-text);
}
.sl-banner--warn { border-color: var(--sl-warn); background: var(--sl-warn-bg); }
.sl-banner--danger { border-color: var(--sl-danger); background: var(--sl-danger-bg); }
.sl-banner--success { border-color: var(--sl-success); background: var(--sl-success-bg); }
.sl-banner strong { display: block; margin-bottom: 2px; }

/* ============ Pills/Badges (estados) ============ */
.sl-pill {
  display: inline-block;
  padding: 2px 10px;
  font-size: 11px;
  font-weight: 600;
  border-radius: var(--sl-radius-pill);
  background: var(--sl-bg-thead);
  color: var(--sl-text);
  text-transform: uppercase;
  letter-spacing: 0.3px;
  white-space: nowrap;
}
.sl-pill--blue   { background: rgba(58,82,156,0.15); color: var(--sl-secondary); }
.sl-pill--orange { background: rgba(242,120,75,0.15); color: var(--sl-primary); }
.sl-pill--green  { background: rgba(54,215,183,0.20); color: #128A6F; }
.sl-pill--red    { background: var(--sl-danger-bg); color: var(--sl-danger); }
.sl-pill--warn   { background: var(--sl-warn-bg); color: var(--sl-warn); }
.sl-pill--grey   { background: var(--sl-bg-thead); color: var(--sl-text-muted); }

/* Risco dot */
.sl-risk { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.sl-risk--low  { background: var(--sl-success); }
.sl-risk--mid  { background: var(--sl-warn); }
.sl-risk--high { background: var(--sl-danger); }

/* ============ Toast ============ */
.sl-toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--sl-text-strong);
  color: #fff;
  padding: 10px 18px;
  border-radius: var(--sl-radius-pill);
  font-size: var(--sl-fs-base);
  box-shadow: var(--sl-shadow-modal);
  opacity: 0;
  transition: all 0.3s ease;
  z-index: 1500;
  pointer-events: none;
}
.sl-toast.is-open {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}
.sl-toast--success { background: #128A6F; }
.sl-toast--error { background: var(--sl-danger); }

/* ============ Empty state ============ */
.sl-empty {
  text-align: center; padding: 48px 24px;
  color: var(--sl-text-muted);
}
.sl-empty__icon { font-size: 36px; margin-bottom: 12px; opacity: 0.5; }
.sl-empty__text strong { display: block; font-size: 16px; color: var(--sl-text); margin-bottom: 4px; }

/* ============ Timeline (histórico, atividade) ============ */
.sl-timeline { position: relative; padding-left: 20px; }
.sl-timeline::before {
  content: ''; position: absolute; left: 6px; top: 4px; bottom: 0;
  width: 2px; background: var(--sl-border);
}
.sl-timeline__item { position: relative; padding: 6px 0 8px; }
.sl-timeline__item::before {
  content: ''; position: absolute; left: -18px; top: 10px;
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--sl-text-muted);
  border: 2px solid var(--sl-bg-card);
  box-shadow: 0 0 0 1px var(--sl-border);
}
.sl-timeline__item--active::before { background: var(--sl-primary); }
.sl-timeline__item--done::before { background: var(--sl-success); }
.sl-timeline__title { font-size: var(--sl-fs-base); font-weight: 500; margin: 0; }
.sl-timeline__meta { font-size: 11px; color: var(--sl-text-muted); }
.sl-timeline__body { font-size: var(--sl-fs-sm); color: var(--sl-text); margin-top: 2px; }

/* ============ Alert row (DSAAG) ============ */
.sl-alert-row {
  display: grid; grid-template-columns: auto 1fr auto auto;
  gap: 12px; align-items: center;
  padding: 8px 12px; border: 1px solid var(--sl-border);
  border-radius: var(--sl-radius-sm);
  background: var(--sl-bg-card); margin-bottom: 6px;
}
.sl-alert-row--critical { border-left: 4px solid var(--sl-danger); }
.sl-alert-row--warning { border-left: 4px solid var(--sl-warn); }
.sl-alert-row--info { border-left: 4px solid var(--sl-info); }
.sl-alert-row__title { font-weight: 600; font-size: var(--sl-fs-base); }
.sl-alert-row__desc { color: var(--sl-text-muted); font-size: var(--sl-fs-sm); margin-top: 2px; }
.sl-alert-row__actions { display: flex; gap: 4px; }

/* ============ Chips de aprovação (multi-proponente) ============ */
.sl-approval-row {
  display: flex; align-items: center; gap: 12px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--sl-border-light);
}
.sl-approval-row__name { flex: 1; font-weight: 500; }
.sl-approval-row__lead-badge {
  display: inline-block;
  padding: 1px 6px;
  background: var(--sl-secondary);
  color: #fff;
  font-size: 10px;
  border-radius: var(--sl-radius-sm);
  font-weight: 600;
}

/* ============ Comments / chat-like (para circulação interna) ============ */
.sl-comment {
  border-left: 3px solid var(--sl-border);
  padding: 8px 12px;
  margin: 6px 0;
  background: var(--sl-bg-sheet);
  border-radius: 0 var(--sl-radius-sm) var(--sl-radius-sm) 0;
}
.sl-comment--fav { border-color: var(--sl-success); background: var(--sl-success-bg); }
.sl-comment--reservas { border-color: var(--sl-warn); background: var(--sl-warn-bg); }
.sl-comment--des { border-color: var(--sl-danger); background: var(--sl-danger-bg); }
.sl-comment__meta { font-size: 11px; color: var(--sl-text-muted); margin-bottom: 4px; }

/* ============ Calendar (mini) ============ */
.sl-mini-cal { font-size: var(--sl-fs-sm); border-collapse: collapse; }
.sl-mini-cal th, .sl-mini-cal td {

.sl-mini-cal__today {

// Estado de auth global
let currentUser = null;

// Permissões consolidadas
function userCan(action, plan) {
  if (!currentUser) return false;
  const r = currentUser.role_id;
  if (r === 'demo') return true;

  switch (action) {
    case 'view_all':
      return ['dapl', 'dsaag'].includes(r);
    case 'criar_plano_via_diploma':
      return ['dapl', 'gabinete'].includes(r);
    case 'gerir_dsaag':
      return ['dapl', 'dsaag'].includes(r);
    case 'validar_ia':
      if (!plan) return ['dapl', 'dsaag', 'gabinete'].includes(r);
      if (r === 'dapl') return true;
      if (r === 'dsaag') return plan.tipo_origem !== 'proponente_via_diploma';
      if (r === 'gabinete') return plan.tipo_origem === 'proponente_via_diploma'
        && plan.area_proponente === currentUser.gabinete_id;
      return false;
    case 'redigir_documento':
      if (!plan) return ['gabinete', 'co_proponente', 'externo'].includes(r);
      if (r === 'gabinete') return plan.area_proponente === currentUser.gabinete_id;
      if (r === 'co_proponente') return plan.co_proponentes?.includes(currentUser.gabinete_id);
      if (r === 'externo') return plan.edit_invitations?.some(i => i.partner.includes(currentUser.gabinete_id?.toUpperCase() || ''));
      return false;
    case 'convidar_externo':
    case 'submeter_aprovacao':
    case 'devolver':
      if (!plan) return ['gabinete', 'co_proponente'].includes(r);
      if (r === 'gabinete') return plan.area_proponente === currentUser.gabinete_id;
      if (r === 'co_proponente') return plan.co_proponentes?.includes(currentUser.gabinete_id);
      return false;
    case 'aprovar':
      if (!plan) return ['gabinete', 'co_proponente'].includes(r);
      if (r === 'gabinete') return plan.area_proponente === currentUser.gabinete_id;
      if (r === 'co_proponente') return plan.co_proponentes?.includes(currentUser.gabinete_id);
      return false;
    case 'submeter_dre':
      return r === 'dapl';
    case 'qa':
      return r === 'dapl';
    default:
      return false;
  }
}

// Filtra planos visíveis para o utilizador atual
function planosVisiveis() {
  if (!currentUser) return [];
  const r = currentUser.role_id;
  if (['dapl', 'dsaag', 'demo'].includes(r)) return PLANOS;
  if (r === 'gabinete') {
    return PLANOS.filter(p => p.area_proponente === currentUser.gabinete_id);
  }
  if (r === 'co_proponente') {
    return PLANOS.filter(p => p.co_proponentes?.includes(currentUser.gabinete_id));
  }
  if (r === 'externo') {
    return PLANOS.filter(p => p.edit_invitations?.length); // simplificação para o mock
  }
  return [];
}

function getEntidade(id) { return ENTIDADES_EXTERNAS.find(e => e.id === id) || null; }

function diasAteData(dateStr) {
  if (!dateStr) return null;
  const today = new Date('2026-04-28');
  const target = new Date(dateStr);
  return Math.round((target - today) / (1000 * 60 * 60 * 24));
}

// Mock AI service (simula análise)
function mockAIAnalysis(diplomaId) {
  const d = getDiploma(diplomaId);
  if (!d) return null;
  // Heurísticas simples
  const sumario = (d.sumario || '').toLowerCase();
  let forma = 'portaria';
  if (sumario.includes('regime jurídico') || sumario.includes('estabelece')) forma = 'decreto_regulamentar';
  if (sumario.includes('lei') || sumario.includes('pegada')) forma = 'decreto_lei';
  return {
    objeto: `Regulamentação das normas habilitantes do ${d.id}, abrangendo: ${d.normas_habilitantes.map(n => n.ref).slice(0,3).join(', ')}.`,
    forma_ato_sugerida: forma,
    prazo_legal_dias: d.prazo_legal_dias,
    normas_habilitantes: d.normas_habilitantes.map(n => ({ ...n, detetada_por_ia: true, estado: 'pendente' })),
    entidades_externas_sugeridas: sumario.includes('proteção') || sumario.includes('identif') ? ['cnpd', 'cejure'] : [],
    confianca_global: 0.65 + Math.random() * 0.25,
    raciocinio: `Análise mock baseada em padrões textuais. Forma "${forma}" inferida do sumário; prazo extraído dos metadados; ${d.normas_habilitantes.length} normas habilitantes detetadas.`,
    provider: 'mock',
  };
}

// ============ Detalhe do plano ============
function viewPlanoDetalhe(planoId, tab='dados') {
  const p = getPlano(planoId);
  if (!p) return `${renderControlPanel({breadcrumb:'Plano não encontrado'})}<div class="sl-empty">🤷 ${planoId}</div>`;
  const dipl = getDiploma(p.diploma_habilitante);
  const area = getArea(p.area_proponente);
  const dias = diasAteData(p.prazo_data);

  // Tabs do notebook (estilo SmartLegis: "Dados do procedimento", "Análise IA", etc.)
  const tabs = [
    ['dados', 'Dados do procedimento'],
    ['ia', 'Análise IA'],
    ['documento', 'Documento'],
    ['normas', 'Normas a Regulamentar'],
    ['acessos', 'Acessos Temporários'],
  ];

  let tabBody = '';
  switch(tab) {
    case 'ia': tabBody = renderTabIA(p); break;
    case 'documento': tabBody = renderTabDocumento(p); break;
    case 'normas': tabBody = renderTabNormas(p); break;
    case 'acessos': tabBody = renderTabAcessos(p); break;
    default: tabBody = renderTabDados(p, dipl, area);
  }

  // Botão principal contextual (filtrado por permissão)
  const podeValidarIA = userCan('validar_ia', p);
  const podeRedigir = userCan('redigir_documento', p);
  const podeSubmeterAprovacao = userCan('submeter_aprovacao', p);
  const podeDevolver = userCan('devolver', p);
  const podeSubmeterDre = userCan('submeter_dre', p);
  const podeAtribuir = userCan('gerir_dsaag', p);
  let actionButtons = '';
  if (p.state === 'proposto') {
    if (p.aguarda_proponente && podeAtribuir) {
      actionButtons += `<button class="sl-btn sl-btn--primary" onclick="atribuirProponente('${p.id}')">Atribuir Proponente</button>`;
    }
    if (podeValidarIA) {
      if (p.ai_status === 'concluida' || p.ai_status === 'falhou') {
        actionButtons += `<button class="sl-btn sl-btn--primary" onclick="validarIA('${p.id}')">Validar IA</button>`;
      }
      actionButtons += `<button class="sl-btn sl-btn--secondary" onclick="rerunIA('${p.id}')">Re-correr IA</button>`;
    }
  } else if (p.state === 'em_redacao' && podeSubmeterAprovacao) {
    actionButtons = `<button class="sl-btn sl-btn--primary" onclick="submeterAprovacao('${p.id}')">Submeter à Aprovação</button>`;
  } else if (p.state === 'em_aprovacao' && podeDevolver) {
    actionButtons = `<button class="sl-btn sl-btn--secondary" onclick="devolverRedacao('${p.id}')">Devolver</button>`;
  } else if (p.state === 'aprovado' && podeSubmeterDre) {
    actionButtons = `<button class="sl-btn sl-btn--primary" onclick="enviarPublicacao('${p.id}')">Enviar para Publicação (DAPL)</button>`;
  }

  // Banner contextual
  let banner = '';
  if (p.ai_status === 'em_curso') {
    banner = `<div class="sl-banner"><div>🤖</div><div><strong>Análise IA em curso…</strong> Aguarde — os campos serão pré-preenchidos automaticamente.</div></div>`;
  } else if (p.state === 'proposto' && p.ai_status === 'concluida') {
    banner = `<div class="sl-banner sl-banner--warn"><div>🤖</div><div><strong>Análise IA concluída · confiança ${(p.ai_confianca * 100).toFixed(0)}%.</strong> Reveja os campos com 🤖 e clique em <em>Validar IA</em>.</div></div>`;
  } else if (p.state === 'em_aprovacao') {
    const total = p.approvals.length;
    const aprovs = p.approvals.filter(a => a.state === 'aprovado').length;
    banner = `<div class="sl-banner sl-banner--warn"><div>🗳️</div><div><strong>Em aprovação multi-proponente · ${aprovs}/${total} aprovaram.</strong> Todos os proponentes têm de aprovar para fechar.</div></div>`;
  } else if (p.state === 'aprovado') {
    banner = `<div class="sl-banner sl-banner--success"><div>✅</div><div><strong>Aprovado por todos os proponentes.</strong> Pronto para envio ao DRE.</div></div>`;
  }

  const idx = PLANOS.findIndex(x => x.id === p.id);

  // Action menu items (estilo SmartLegis "Ação ▼")
  const acaoItems = [
    'Audições', 'Pedir Parecer Prévio', 'Retomar Procedimento',
    'Alterar Gabinete Proponente', 'Revisão de Diploma',
    'Alterar adjunto responsável', 'Alterar adjuntos co-responsáveis',
    'Devolver ao proponente', 'Adic./Rem. Favoritos',
    'Arquivar Procedimento', 'Exportar Capa', 'Exportar Nota Justificativa',
  ];

  return `
    ${renderControlPanel({
      breadcrumb: `<a href="#/dashboard">Dashboard</a><span class="sl-cp__breadcrumb-sep">›</span> <a href="#/planos">Regulamentação</a><span class="sl-cp__breadcrumb-sep">›</span> ${p.id}`,
      buttons: actionButtons,
      pager: `<div class="sl-pager">
        <span>${idx+1} / ${PLANOS.length}</span>
        <button class="sl-pager__nav" onclick="navegarPlano(-1)">‹</button>
        <button class="sl-pager__nav" onclick="navegarPlano(1)">›</button>
      </div>`,
      actions: `
        <div style="position:relative">
          <button class="sl-btn sl-btn--secondary" onclick="toggleAcao(event)">Ação ▾</button>
          <div class="sl-dropdown" id="acao-dropdown" style="right:0;top:100%">
            ${acaoItems.map(a => `<a class="sl-dropdown__item" onclick="toast('${a} (mock)')">${a}</a>`).join('')}
          </div>
        </div>
      `,
    })}

    <div class="sl-form-bg">
      <div class="sl-form-sheet">
        ${banner}

        <h1 class="sl-form__title">${escapeHtml(p.titulo)}</h1>
        <div class="sl-form__subtitle">${p.id} · Diploma habilitante: ${p.diploma_habilitante} · ${pillAI(p.ai_status)}</div>

        <!-- Notebook (tabs) -->
        <div class="sl-notebook">
          <div class="sl-notebook__tabs">
            ${tabs.map(([k, l]) => `
              <button class="sl-notebook__tab ${tab === k ? 'sl-notebook__tab--active' : ''}"
                      onclick="location.hash='#/plano/${p.id}/${k}'">${l}</button>
            `).join('')}
          </div>
          <div class="sl-notebook__page">${tabBody}</div>
        </div>

        <!-- Secções colapsáveis (estilo SmartLegis real, em vez de chatter) -->
        ${renderSection('🗳️ APROVAÇÕES', renderSeccaoAprovacoes(p), {open: p.state === 'em_aprovacao' || p.state === 'aprovado'})}
        ${renderSection('📚 VERSÕES DO DOCUMENTO', renderSeccaoVersoes(p), {open: false})}
        ${renderSection('✉️ EDIÇÃO EXTERNA', renderSeccaoEdicaoExterna(p), {open: false})}
        ${renderSection('📅 HISTÓRICO DE EVENTOS', renderSeccaoHistorico(p), {open: false})}
        ${renderSection('💬 COMENTÁRIOS', renderSeccaoComentarios(p), {open: false})}
        ${renderSection('🔒 PERMISSÕES', renderSeccaoPermissoes(p), {open: false})}
      </div>
    </div>
  `;
}

function renderTabDados(p, dipl, area) {
  // Edição inline dos campos pré-preenchidos pela IA (apenas em estado proposto, com permissão)
  const editavel = p.state === 'proposto' && userCan('validar_ia', p);
  const editHint = editavel ? `<span class="sl-ia-edit-hint">(editável até validação)</span>` : '';

  // Helper para mostrar input ou valor read-only
  const inputOrValue = (val, field, type='text', isLong=false) => {
    if (!editavel) return `<div class="sl-form__value">${escapeHtml(val)}</div>`;
    if (isLong) return `<textarea class="sl-form__textarea" onchange="updatePlanField('${p.id}','${field}',this.value)">${escapeHtml(val)}</textarea>`;
    return `<input type="${type}" class="sl-form__input" value="${escapeHtml(String(val))}" onchange="updatePlanField('${p.id}','${field}',this.value)">`;
  };

  return `
    <div class="sl-form__row">
      <div class="sl-form__field">
        <label class="sl-form__label sl-form__label--required">Número</label>
        <div class="sl-form__value">${p.id}</div>
      </div>
      <div class="sl-form__field">
        <label class="sl-form__label sl-form__label--required">Título</label>
        ${inputOrValue(p.titulo, 'titulo')}
      </div>
    </div>
    <div class="sl-form__row">
      <div class="sl-form__field">
        <label class="sl-form__label">Diploma Habilitante</label>
        <div class="sl-form__value"><strong>${p.diploma_habilitante}</strong>${dipl ? ` · ${escapeHtml(dipl.sumario.substring(0,60))}…` : ''}</div>
      </div>
      <div class="sl-form__field">
        <label class="sl-form__label">Origem</label>
        <div class="sl-form__value">${p.tipo_origem.replace(/_/g, ' ')}</div>
      </div>
    </div>
    <div class="sl-form__row">
      <div class="sl-form__field">
        <label class="sl-form__label sl-form__label--required">Forma de Ato Prevista${p.forma_ato_origem_ia && p.ai_status !== 'validada' ? badgeIA() : ''}${editHint}</label>
        ${editavel ? `
          <select class="sl-form__select" onchange="updatePlanField('${p.id}','forma_ato_prevista',this.value)">
            ${FORMAS_ATO.map(([v,l]) => `<option value="${v}" ${p.forma_ato_prevista === v ? 'selected' : ''}>${l}</option>`).join('')}
          </select>
        ` : `<div class="sl-form__value">${getFormaAtoLabel(p.forma_ato_prevista)}</div>`}
      </div>
      <div class="sl-form__field">
        <label class="sl-form__label">Prazo Legal (dias)${p.prazo_origem_ia && p.ai_status !== 'validada' ? badgeIA() : ''}${editHint}</label>
        ${editavel ? `<input type="number" class="sl-form__input" value="${p.prazo_legal_dias}" min="1" max="730" onchange="updatePlanField('${p.id}','prazo_legal_dias',parseInt(this.value)||60)">` : `<div class="sl-form__value">${p.prazo_legal_dias} dias</div>`}
      </div>
    </div>
    <div class="sl-form__row">
      <div class="sl-form__field">
        <label class="sl-form__label">Prazo Limite</label>
        <div class="sl-form__value">${p.prazo_data || '—'} <span class="sl-text-muted">(${fmtDays(diasAteData(p.prazo_data))})</span></div>
      </div>
      <div class="sl-form__field">
        <label class="sl-form__label">Risco</label>
        <div class="sl-form__value">${riskDot(p.risco)} ${p.risco === 'low' ? 'Baixo' : p.risco === 'mid' ? 'Médio' : 'Alto'}</div>
      </div>
    </div>
    <div class="sl-form__row">
      <div class="sl-form__field">
        <label class="sl-form__label">Área Governativa Proponente</label>
        ${editavel ? `
          <select class="sl-form__select" onchange="updatePlanField('${p.id}','area_proponente',this.value)">
            <option value="">— escolha —</option>
            ${AREAS_GOVERNATIVAS.map(a => `<option value="${a.id}" ${p.area_proponente === a.id ? 'selected' : ''}>${a.sigla} · ${a.nome}</option>`).join('')}
          </select>
        ` : `<div class="sl-form__value">${area ? `<strong>${area.sigla}</strong> · ${area.nome}` : '<em class="sl-text-muted">não atribuída</em>'}</div>`}
      </div>
      <div class="sl-form__field">
        <label class="sl-form__label">Adjunto Responsável</label>
        ${inputOrValue(p.adjunto_responsavel || '', 'adjunto_responsavel')}
      </div>
    </div>
    <div class="sl-form__row">
      <div class="sl-form__field sl-form__field--full">
        <label class="sl-form__label">Co-proponente(s)</label>
        <div class="sl-form__value">${p.co_proponentes?.map(c => `<span class="sl-pill sl-pill--blue" style="margin-right:4px">${getArea(c)?.sigla}</span>`).join('') || '—'}</div>
      </div>
    </div>
    <div class="sl-form__row">
      <div class="sl-form__field sl-form__field--full">
        <label class="sl-form__label sl-form__label--required">Objeto da Regulamentação${p.objeto_origem_ia && p.ai_status !== 'validada' ? badgeIA() : ''}${editHint}</label>
        ${inputOrValue(p.objeto || '', 'objeto', 'text', true)}

    </div>
    <div class="sl-form__row">
      <div class="sl-form__field sl-form__field--full">
        <label class="sl-form__label">Situação</label>
        <div class="sl-form__value">${pillEstado(p.state)}</div>
      </div>
    </div>
    <div class="sl-mt-16">
      <a class="sl-btn sl-btn--primary" onclick="toast('Ver Capa (mock)')">Ver Capa</a>
    </div>
  `;
}

function renderSeccaoAprovacoes(p) {
  if (!p.approvals?.length) {
    return `<div class="sl-text-muted">Sem aprovações ainda. Aprovações são criadas ao submeter à aprovação.</div>`;
  }
  const total = p.approvals.length;
  const aprovs = p.approvals.filter(a => a.state === 'aprovado').length;
  const pct = Math.round(100 * aprovs / total);
  return `
    <div class="sl-progress sl-mb-8"><div class="sl-progress__bar" style="width:${pct}%"></div></div>
    <div class="sl-text-muted sl-mb-16" style="font-size:12px">${aprovs}/${total} aprovaram (${pct}%)</div>
    <table class="sl-table sl-table--inline">
      <thead><tr><th>Gabinete</th><th>Tipo</th><th>Estado</th><th>Aprovou</th><th>Em</th><th>Notas</th><th>Ações</th></tr></thead>
      <tbody>
        ${p.approvals.map((a, idx) => `
          <tr>
            <td><strong>${getArea(a.company_id)?.sigla || a.company_id}</strong></td>
            <td>${a.is_lead ? '<span class="sl-approval-row__lead-badge">LEAD</span>' : '<span class="sl-pill sl-pill--grey">CO</span>'}</td>
            <td>${pillApproval(a.state)}</td>
            <td>${a.approver || '—'}</td>
            <td>${a.approved_at || '—'}</td>
            <td><div style="max-width:180px;font-size:11px;color:var(--sl-text-muted)">${escapeHtml(a.notes || '')}</div></td>
            <td>
              ${a.state === 'pendente' && p.state === 'em_aprovacao' ? `
                <button class="sl-btn sl-btn--small sl-btn--primary" onclick="aprovar('${p.id}', ${idx})">Aprovar</button>
                <button class="sl-btn sl-btn--small sl-btn--danger" onclick="rejeitar('${p.id}', ${idx})">Rejeitar</button>

}

function alertaRow(a, isHistorico=false) {
  const cls = a.gravidade === 'critical' ? 'sl-alert-row--critical' : a.gravidade === 'warning' ? 'sl-alert-row--warning' : 'sl-alert-row--info';
  const icone = a.gravidade === 'critical' ? '🚨' : a.gravidade === 'warning' ? '⚠️' : 'ℹ️';
  const link = a.plan_id ? `#/plano/${a.plan_id}` : '#/diplomas-publicados';
  return `
    <div class="sl-alert-row ${cls}">
      <div style="font-size:18px">${icone}</div>
      <div>
        <div class="sl-alert-row__title">${escapeHtml(a.titulo)}</div>
        <div class="sl-alert-row__desc">${escapeHtml(a.descricao)} · ${a.gerado_em}</div>
        ${isHistorico ? `<div class="sl-text-muted" style="font-size:11px;margin-top:4px">✓ Tratado por ${a.tratado_por} em ${a.tratado_em}</div>` : ''}

// ============ Routing ============
function router() {
  loadAuth();
  const main = document.getElementById('main');
  const topbar = document.getElementById('topbar');

  // Route guard: sem auth → login screen
  if (!currentUser) {
    if (topbar) topbar.style.display = 'none';
    main.innerHTML = viewLogin();
    return;
  }
  if (topbar) topbar.style.display = '';
  refreshUserPill();

  const hash = location.hash.replace(/^#\//, '') || 'dashboard';
  const parts = hash.split('/').filter(Boolean);
  const breadcrumb = document.getElementById('breadcrumb');

  const route = parts[0];

  let html = '';
  let bc = 'Dashboard';
  if (route === 'dashboard') { html = viewDashboard(); bc = 'Dashboard'; }
  else if (route === 'planos') { html = viewPlanos(); bc = 'Planos'; }
  else if (route === 'plano' && parts[1] === 'novo') {
    if (!app.lastRoute || app.lastRoute !== 'plano-novo') {
      wizardState = {
        step: 1,
        diploma_habilitante: null, origem_diploma: 'em_curso',
        tipo_origem: 'proponente_via_diploma', titulo: '',
        forma_ato: 'portaria', correr_ia: true,
      };
    }
    html = viewWizard(); bc = 'Planos · Novo';
    app.lastRoute = 'plano-novo';
  }
  else if (route === 'plano' && parts[1]) {
    let id, tab;
    if (parts.length >= 4) {
      id = parts.slice(1, 4).join('/');
      tab = parts[4] || 'dados';
    } else {
      id = parts[1]; tab = parts[2] || 'dados';
    }
    html = viewPlanoDetalhe(id, tab);
    bc = `Planos · ${id}`;
  }
  else if (route === 'dsaag') { html = viewDsaag(); bc = 'DSAAG'; }
  else if (route === 'diplomas-publicados') { html = viewDiplomasPublicados(); bc = 'Diplomas publicados'; }
  else { html = viewDashboard(); }

  main.innerHTML = html;
  // Breadcrumb na topbar SmartLegis: "Está em: ..."
  const segments = bc.split(' · ');
  if (breadcrumb) {
    breadcrumb.innerHTML = `Está em: <a href="#/dashboard">Dashboard</a>${segments.length > 1 ? ' › ' + segments.slice(1).join(' › ') : ''}`;
  }
  // Marca item ativo no sidebar
  document.querySelectorAll('.sl-sidebar__item').forEach(a => a.classList.remove('sl-sidebar__item--active'));
  const sideLink = document.querySelector(`.sl-sidebar__item[data-route="${route}"]`);
  if (sideLink) sideLink.classList.add('sl-sidebar__item--active');
  if (route !== 'plano' || parts[1] !== 'novo') app.lastRoute = route;
  refreshAlertCount();
}

function guardarVersao(planoId, autorRole='lead') {
  // autorRole: 'lead' | 'co' | 'externo'
  // Só edições do lead invalidam aprovações já dadas (decisão DAPL 2026-04-28)
  const p = getPlano(planoId);
  if (!p) return;
  if (p.state !== 'em_redacao' && p.state !== 'em_aprovacao') {
    toast('Só pode guardar em "Em Redação" ou "Em Aprovação"', 'error'); return;
  }
  const last = p.versoes[p.versoes.length-1]?.numero || 'v0.0';
  const [maj, min] = last.replace('v','').split('.');
  const next = `v${maj}.${parseInt(min)+1}`;
  const autorLabel = autorRole === 'lead' ? 'Utilizador DAPL (LEAD)'
                   : autorRole === 'co' ? 'Co-proponente · Sofia Lima'
                   : 'Externo · CEJURE';
  p.versoes.push({
    numero: next, tipo: 'interna',
    data: new Date().toISOString().slice(0,10),
    autor: autorLabel, track_changes: Math.floor(Math.random()*15),
    summary: `Save consolidado por ${autorRole === 'lead' ? 'lead' : autorRole}`,
  });
  p.historico.push({
    data: new Date().toISOString().slice(0,10),
    evento: `💾 Versão ${next} guardada (autor: ${autorRole})`,
    autor: autorLabel,
  });
  // Política: só edição do LEAD invalida aprovações
  if (p.state === 'em_aprovacao') {
    if (autorRole === 'lead') {
      p.approvals.forEach(a => { if (a.state === 'aprovado') { a.state = 'pendente'; a.approver = null; a.approved_at = null; }});
      p.state = 'em_redacao';
      p.historico.push({
        data: new Date().toISOString().slice(0,10),
        evento: '⚠️ LEAD alterou · aprovações invalidadas · plano volta a Em Redação',
        autor: 'Sistema',
      });
      toast(`${next} guardada · aprovações invalidadas (lead editou)`, 'success');
    } else {
      p.historico.push({
        data: new Date().toISOString().slice(0,10),
        evento: `ℹ️ ${autorRole} editou · aprovações mantidas (não é lead)`,
        autor: 'Sistema',
      });
      toast(`${next} guardada · aprovações mantidas (não é edição do lead)`, 'success');
    }
  } else {
    toast(`${next} guardada`, 'success');
  }
  app.rerender();
}

function aprovar(planoId, idx) {
  const p = getPlano(planoId);
  if (!p) return;
  const a = p.approvals[idx];
  if (a.state !== 'pendente') { toast('Já tratado', 'error'); return; }
  const notes = prompt('Notas / reservas (opcional):', '') || '';
  a.state = 'aprovado';
  a.approver = 'Utilizador DAPL';
  a.approved_at = new Date().toISOString().slice(0,16).replace('T',' ');
  a.notes = notes;
  p.historico.push({ data: new Date().toISOString().slice(0,10), evento: `✓ Aprovação ${getArea(a.company_id)?.sigla}`, autor: 'Utilizador DAPL' });
  // Verificar se todos aprovaram
  const todos = p.approvals.every(x => x.state === 'aprovado');
  if (todos) {
    p.state = 'aprovado';
    p.historico.push({ data: new Date().toISOString().slice(0,10), evento: '✅ Todos aprovaram · plano em estado APROVADO', autor: 'Sistema' });
    toast(`${getArea(a.company_id)?.sigla} aprovou · TODOS aprovaram → estado APROVADO`, 'success');
  } else {
    const aprovs = p.approvals.filter(x => x.state === 'aprovado').length;
    toast(`${getArea(a.company_id)?.sigla} aprovou (${aprovs}/${p.approvals.length})`, 'success');
  }
  app.rerender();
}

function rejeitar(planoId, idx) {
  const p = getPlano(planoId);

  const motivo = prompt('Motivo da rejeição (obrigatório):');

  a.state = 'rejeitado';
  a.approver = 'Utilizador DAPL';
  a.notes = motivo;
  // Outras aprovações voltam a pendente; estado vai para em_redacao
  p.approvals.forEach(x => { if (x !== a && x.state === 'aprovado') { x.state = 'pendente'; x.approver = null; }});
  p.state = 'em_redacao';
  p.historico.push({ data: new Date().toISOString().slice(0,10), evento: `✗ Rejeição ${getArea(a.company_id)?.sigla} · ${motivo}`, autor: 'Utilizador DAPL' });

function navegarPlano(delta) {
  const parts = location.hash.replace(/^#\//,'').split('/').filter(Boolean);
  if (parts[0] !== 'plano' || parts.length < 4) return;
  const id = parts.slice(1, 4).join('/');
  const tab = parts[4] || 'visao';
  const idx = PLANOS.findIndex(p => p.id === id);
  if (idx === -1) return;
  const novoIdx = (idx + delta + PLANOS.length) % PLANOS.length;
  location.hash = `#/plano/${PLANOS[novoIdx].id}/${tab}`;
}

// ============ Vista DSAAG ============
function varrerDR() {
  toast('🔍 A varrer Diário da República...');
  setTimeout(() => {
    const ja = new Set(DIPLOMAS_VARRIDOS.map(d => d.id));
    const semPlano = DIPLOMAS.filter(d => d.estado === 'Publicado' && !d.tem_plano_regulamentacao && !ja.has(d.id));
    if (!semPlano.length) {
      toast('Sem novos diplomas. 🎉', 'success');
    } else {
      DIPLOMAS_VARRIDOS = [...DIPLOMAS_VARRIDOS, ...semPlano];
      toast(`Detetados ${semPlano.length} novos diplomas`, 'success');
      app.rerender();
    }
  }, 800);
}

function dsaagAceitar(diplomaId) {
  DIPLOMAS_VARRIDOS = DIPLOMAS_VARRIDOS.filter(d => d.id !== diplomaId);
  // Pré-popular wizard e ir
  wizardState = {
    diploma_habilitante: diplomaId, origem_diploma: 'publicado',
    tipo_origem: 'dsaag_manual', titulo: '', correr_ia: true,
  };
  toast('Diploma aceite · IA será disparada...', 'success');
  setTimeout(() => location.hash = '#/plano/novo', 500);
}

function dsaagAtribuir(diplomaId) {
  const d = getDiploma(diplomaId);
  if (!d) return;
  DIPLOMAS_VARRIDOS = DIPLOMAS_VARRIDOS.filter(x => x.id !== diplomaId);
  const next = String(PLANOS.length + 1).padStart(5, '0');
  const novoId = `REG-${next}/XXIV/2026`;
  const novoPlano = {
    id: novoId, titulo: `Regulamentação de ${d.id}`,
    tipo_origem: 'dsaag_manual', diploma_habilitante: d.id,
    state: 'proposto', ai_status: 'em_curso', ai_provider: 'mock',
    ai_confianca: 0, ai_summary: '',
    objeto: '(a preencher pela IA...)',
    forma_ato_prevista: 'portaria',
    prazo_legal_dias: d.prazo_legal_dias,
    prazo_data: d.data_publicacao ? new Date(new Date(d.data_publicacao).getTime() + d.prazo_legal_dias * 86400000).toISOString().slice(0,10) : null,
    area_proponente: d.proponente,
    co_proponentes: [], adjunto_responsavel: null,
    entidades_externas: [], normas: [], approvals: [], versoes: [], edit_invitations: [],
    document_html: '',
    historico: [
      { data: new Date().toISOString().slice(0,10), evento: 'Plano criado pela DSAAG · proponente atribuído', autor: 'Utilizador DAPL (DSAAG)' },
    ],
    risco: 'low', aguarda_proponente: false,
  };
  PLANOS.push(novoPlano);
  // Simular IA
  setTimeout(() => {
    const result = mockAIAnalysis(d.id);
    Object.assign(novoPlano, {
      ai_status: 'concluida', ai_confianca: result.confianca_global,
      ai_summary: result.raciocinio,
      objeto: result.objeto, objeto_origem_ia: true,
      forma_ato_prevista: result.forma_ato_sugerida, forma_ato_origem_ia: true,
      prazo_legal_dias: result.prazo_legal_dias, prazo_origem_ia: true,
      normas: result.normas_habilitantes,
    });
    novoPlano.historico.push({ data: new Date().toISOString().slice(0,10), evento: `🤖 IA concluída (${(result.confianca_global*100).toFixed(0)}%)`, autor: 'Sistema' });
    app.rerender();
  }, 1500);
  toast(`Plano ${novoId} criado · ${getArea(d.proponente)?.sigla} notificado`, 'success');
  app.rerender();
}

function dsaagDispensar(diplomaId) {
  DIPLOMAS_VARRIDOS = DIPLOMAS_VARRIDOS.filter(d => d.id !== diplomaId);
  toast('Dispensa registada (mock)');
  app.rerender();
}

function tratarAlerta(alertId) {
  const a = ALERTAS.find(x => x.id === alertId);
  if (!a) return;
  a.tratado_em = new Date().toISOString().slice(0,16).replace('T',' ');
  a.tratado_por = 'Utilizador DAPL (DSAAG)';
  a.acao_tomada = 'criar_plano';
  toast('Alerta tratado');
  app.rerender();
}

function atribuirProponente(planoId) {
  const p = getPlano(planoId);
  if (!p) return;
  const sigla = prompt('Sigla da área proponente (ex.: METD, MAAC, MP):', 'MP');
  if (!sigla) return;
  const area = AREAS_GOVERNATIVAS.find(a => a.sigla.toLowerCase() === sigla.toLowerCase());
  if (!area) { toast('Não encontrado', 'error'); return; }
  p.area_proponente = area.id;
  p.aguarda_proponente = false;
  p.adjunto_responsavel = `Adjunto ${area.sigla}`;
  p.historico.push({ data: new Date().toISOString().slice(0,10), evento: `Proponente atribuído: ${area.nome}`, autor: 'Utilizador DAPL (DSAAG)' });
  toast(`${area.sigla} atribuído`, 'success');
  app.rerender();
}

</script>
